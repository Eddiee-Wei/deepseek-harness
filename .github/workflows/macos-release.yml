name: macOS desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact DeepSeek Harness version; defaults to apps/cli/package.json
        required: false
        type: string
  push:
    tags:
      - app-v*
      - test-v*

permissions:
  contents: write

concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify protected local transport
        run: >-
          pnpm exec vitest run
          packages/host/webserver/tests/webserver.spec.ts
          packages/bundle/web-app/tests/startup.spec.ts
          packages/bundle/web-app/tests/web-app.spec.ts

      - name: Resolve app version
        id: version
        shell: zsh {0}
        env:
          DSH_REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          requested="$DSH_REQUESTED_VERSION"
          harness_version="$(node -p "require('./apps/cli/package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            case "$GITHUB_REF_NAME" in
              app-v*) requested="${GITHUB_REF_NAME#app-v}" ;;
              test-v*) requested="${GITHUB_REF_NAME#test-v}" ;;
              *)
                print -u2 "unsupported release tag: $GITHUB_REF_NAME"
                exit 2
              ;;
            esac
          fi
          if [[ -z "$requested" ]]; then
            requested="$harness_version"
          fi
          if [[ "$requested" != "$harness_version" ]]; then
            print -u2 "release tag version $requested does not match apps/cli/package.json version $harness_version"
            exit 2
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == app-v* && "$harness_version" == *-* ]]; then
            print -u2 "prerelease Harness versions use test-v*; app-v* is reserved for stable notarized releases"
            exit 2
          fi
          app_version="${harness_version%%-*}"
          app_version="${app_version%%+*}"
          if [[ "$app_version" != <->.<->.<-> ]]; then
            print -u2 "Harness version does not provide a numeric macOS bundle version: $harness_version"
            exit 2
          fi
          artifact_basename="DeepSeek-Harness-$harness_version-macOS-arm64"
          print "harness_version=$harness_version" >> "$GITHUB_OUTPUT"
          print "app_version=$app_version" >> "$GITHUB_OUTPUT"
          print "artifact_basename=$artifact_basename" >> "$GITHUB_OUTPUT"

      - name: Require credentials for a notarized release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'app-v')
        shell: zsh {0}
        run: |
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${(P)name}" ]]; then
              print -u2 "missing required GitHub secret: $name"
              exit 2
            fi
          done

      - name: Import Developer ID certificate
        if: env.APPLE_CERTIFICATE_P12_BASE64 != '' && !startsWith(github.ref_name, 'test-v')
        shell: zsh {0}
        run: |
          keychain="$RUNNER_TEMP/dsh-signing.keychain-db"
          certificate="$RUNNER_TEMP/dsh-signing.p12"
          print -rn -- "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$RUNNER_TEMP" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$RUNNER_TEMP" "$keychain"
          security list-keychains -d user -s "$keychain"
          xcrun notarytool store-credentials dsh-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Build, sign, notarize, and verify DMG
        shell: zsh {0}
        env:
          DSH_HARNESS_VERSION_EXPECTED: ${{ steps.version.outputs.harness_version }}
          DSH_APP_VERSION: ${{ steps.version.outputs.app_version }}
          DSH_APP_BUILD_NUMBER: ${{ github.run_number }}
          DSH_SOURCE_REVISION: ${{ github.sha }}
        run: |
          export DSH_NODE_BINARY="$(node -p 'process.execPath')"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == test-v* ]]; then
            export APPLE_SIGNING_IDENTITY=-
            unset APPLE_NOTARY_PROFILE
          elif [[ -n "$APPLE_SIGNING_IDENTITY" ]]; then
            export APPLE_NOTARY_PROFILE=dsh-notary
          else
            export APPLE_SIGNING_IDENTITY=-
          fi
          zsh apps/macos/build.sh dmg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact_basename }}
          path: |
            .artifacts/macos/${{ steps.version.outputs.artifact_basename }}.dmg
            .artifacts/macos/${{ steps.version.outputs.artifact_basename }}.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish notarized GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'app-v')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: DeepSeek Harness ${{ steps.version.outputs.harness_version }} for macOS
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            .artifacts/macos/${{ steps.version.outputs.artifact_basename }}.dmg
            .artifacts/macos/${{ steps.version.outputs.artifact_basename }}.dmg.sha256

      - name: Publish unsigned test Pre-release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'test-v')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: DeepSeek Harness ${{ steps.version.outputs.harness_version }} unsigned macOS test build
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            > [!WARNING]
            > This Apple Silicon test build uses ad hoc signing and has not been Apple-notarized. macOS may block normal installation. It is for trusted testing only, not general distribution.
            >
            > 此 Apple Silicon 测试包仅使用 ad hoc 签名，未经 Apple 公证。macOS 可能阻止常规安装；它只用于可信测试，不适合公开分发。

            This DeepSeek Harness macOS build is independently maintained by the community and is not sponsored, endorsed, or approved by DeepSeek.

            Verify the download against the attached `.sha256` file before opening it.
          files: |
            .artifacts/macos/${{ steps.version.outputs.artifact_basename }}.dmg
            .artifacts/macos/${{ steps.version.outputs.artifact_basename }}.dmg.sha256
